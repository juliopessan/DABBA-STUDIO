  <rect x="536" y="216" width="272" height="272" rx="28" fill="#D97757"/>
  <rect x="216" y="536" width="272" height="272" rx="28" fill="#D97757"/>
  <rect x="536" y="536" width="272" height="272" rx="28" fill="#12100E"/>
</svg>
